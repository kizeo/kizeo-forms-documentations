project_identifier_env: CROWDIN_DOCUSAURUS_PROJECT_ID
api_key_env: CROWDIN_DOCUSAURUS_API_KEY
base_path: "./"
preserve_hierarchy: true

files:
  # Documentation Markdown files
  - source: "/docs/**/*.md"
    translation: "/i18n/%locale%/docusaurus-plugin-content-docs/current/%original_path%/%original_file_name%"
    languages_mapping: &anchor
      locale:
        "fr": "fr"
  # Theme / UI + homepage JSON translation files (generated by `docusaurus write-translations`)
  - source: "/i18n/en/**/*.json"
    translation: "/i18n/%locale%/**/%original_file_name%"
    languages_mapping: *anchor
